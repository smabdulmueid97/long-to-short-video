<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="long-to-short-video — one long video, 5 to 10 standalone shorts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF0033"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3E8FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="90" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="110" cy="300" r="70" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="980" cy="300" r="40" fill="#FFFFFF" opacity="0.10"/>
  <rect x="60" y="52" width="14" height="52" rx="4" fill="#FFFFFF"/>
  <rect x="86" y="52" width="14" height="34" rx="4" fill="#FFFFFF" opacity="0.65"/>
  <rect x="112" y="52" width="14" height="52" rx="4" fill="#FFFFFF" opacity="0.4"/>
  <text x="150" y="90" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="bold" fill="#FFFFFF">long-to-short-video</text>
  <text x="60" y="138" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FFD6DE">One long video in. 5–10 standalone shorts out.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="170" width="190" height="54" rx="27" fill="#FFFFFF"/>
    <text x="155" y="205" font-size="22" font-weight="bold" fill="#C81E3A" text-anchor="middle">9:16 vertical</text>
    <rect x="270" y="170" width="190" height="54" rx="27" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="365" y="205" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">30–60 s clips</text>
    <rect x="480" y="170" width="150" height="54" rx="27" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="555" y="205" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ffmpeg</text>
  </g>
  <g>
    <rect x="700" y="150" width="440" height="130" rx="16" fill="url(#card)"/>
    <text x="730" y="190" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#7C3AED">“You are losing $400 a month</text>
    <text x="730" y="218" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#7C3AED">to late invoices.”</text>
    <text x="730" y="252" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#444444">Hook in the first 2 seconds — or it is not a clip.</text>
    <text x="730" y="272" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#444444">Plan first. Approve. Then cut.</text>
  </g>
  <text x="60" y="320" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#FFC9D4">Shorts • Reels • TikTok • Bilibili • LinkedIn • X  —  plan first, cutting is the expensive part</text>
</svg>
